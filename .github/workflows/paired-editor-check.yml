name: Paired editor verification
on:
  push:
    branches: [feature/paired-elevators-i18n]
    paths:
      - .github/workflows/paired-editor-check.yml
      - web/**
      - scheduler/**
      - tests/**
      - app.py
permissions:
  contents: write
concurrency:
  group: paired-editor-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install test dependencies
        run: |
          python3 -m venv .verify-env
          .verify-env/bin/pip install -r requirements.txt playwright
          .verify-env/bin/python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Unit and native browser verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-artifacts
          .verify-env/bin/python -m unittest discover -s tests -v 2>&1 | tee test-artifacts/unit-tests.log
          .verify-env/bin/python tests/browser_editor.py 2>&1 | tee test-artifacts/editor-tests.log
          .verify-env/bin/python tests/browser_portals.py 2>&1 | tee test-artifacts/portal-tests.log
          .verify-env/bin/python scripts/build_editor_gif.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: paired-editor-verification
          retention-days: 7
          path: |
            test-artifacts/
            docs/assets/dispatch-demo.gif
      - name: Commit only verified README animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/assets/dispatch-demo.gif
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh paired elevator walkthrough from verified browser UI'
            git push origin HEAD:refs/heads/feature/paired-elevators-i18n
          fi
