name: Build README walkthrough

on:
  push:
    branches: [docs/concise-readme-demo]
    paths:
      - scripts/make_readme_demo.py
      - .github/workflows/readme-demo-build.yml

permissions:
  contents: write

concurrency:
  group: readme-demo-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Capture and validate the real interface
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .demo-env
          source .demo-env/bin/activate
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
          python -m unittest discover -s tests -v
          python tests/browser_studio.py
          python scripts/make_readme_demo.py --width 960
          sha256sum docs/assets/dispatch-demo.gif
      - uses: actions/upload-artifact@v4
        with:
          name: readme-demo-preview
          retention-days: 7
          path: |
            docs/assets/dispatch-demo.gif
            test-artifacts/studio-plan.png
            test-artifacts/studio-building.png
            test-artifacts/studio-math.png
            test-artifacts/browser-report.json
      - name: Commit only the generated GIF to this documentation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/assets/dispatch-demo.gif
          if ! git diff --cached --quiet; then
            git commit -m 'docs: add captured UI walkthrough GIF'
            git push origin HEAD:refs/heads/docs/concise-readme-demo
          fi
