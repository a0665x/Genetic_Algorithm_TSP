name: Semantic map workbench
on:
  push:
    branches: [feature/semantic-map-import]
    paths: [.github/workflows/semantic-workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: dispatch
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: a0665x/Graph_nodes_path_planning
          ref: 12e874932ab445f2f6ab6689757446c9247df5c7
          path: graph
          persist-credentials: false
      - run: |
          git -C dispatch archive --format=zip --output="$GITHUB_WORKSPACE/dispatch-source.zip" ae57f4c725920c42035f164f229df89f39f605ba
          git -C graph archive --format=zip --output="$GITHUB_WORKSPACE/graph-source.zip" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-sources
          path: '*-source.zip'
          retention-days: 1
