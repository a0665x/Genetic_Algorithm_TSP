name: Verify Sheet workbench
on:
  push:
    branches: [feature/sheet-first-workbench]
    paths:
      - .github/workflows/sheet-workbench-check.yml
      - .github/sheet-*.json
      - .github/apply-sheet.py
      - .github/sheet-docs.py
permissions:
  contents: write
concurrency:
  group: sheet-workbench-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Apply and match reviewed source
        run: python3 .github/apply-sheet.py
      - name: Install test dependencies
        run: |
          python3 -m venv .test-env
          .test-env/bin/python -m pip install -r requirements.txt playwright
          .test-env/bin/python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - name: Unit and native-browser verification
        shell: bash
        run: |
          set -euo pipefail
          source .test-env/bin/activate
          mkdir -p test-artifacts
          python -m unittest discover -s tests -v 2>&1 | tee test-artifacts/unit-tests.log
          python tests/browser_editor.py 2>&1 | tee test-artifacts/editor-native.log
          python tests/browser_portals.py 2>&1 | tee test-artifacts/portals-native.log
          python tests/browser_map_import.py 2>&1 | tee test-artifacts/maps-native.log
          python tests/browser_workbench.py 2>&1 | tee test-artifacts/workbench-native.log
          python scripts/build_sheet_gif.py
          python .github/apply-sheet.py --check
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sheet-workbench-verification
          retention-days: 7
          path: |
            test-artifacts/
            docs/assets/dispatch-demo.gif
            .github/sheet-manifest.json
      - name: Commit only verified sources and animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          .test-env/bin/python .github/apply-sheet.py --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sheet-verified-source
          path: sheet-verified-source.zip
          retention-days: 1
