name: Verify semantic map import
on:
  push:
    branches: [feature/semantic-map-import]
    paths:
      - .github/integrate-semantic.py
      - .github/workflows/verify-semantic-import.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: dispatch
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: a0665x/Graph_nodes_path_planning
          ref: 12e874932ab445f2f6ab6689757446c9247df5c7
          path: graph
          persist-credentials: false
      - name: Integrate and verify reviewed map imports
        working-directory: dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/integrate-semantic.py ../graph
          python3 -m venv .demo-env
          source .demo-env/bin/activate
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
          mkdir -p test-artifacts
          python -m unittest discover -s tests -v 2>&1 | tee test-artifacts/unit-tests.log
          python tests/browser_editor.py 2>&1 | tee test-artifacts/editor-native.log
          python tests/browser_portals.py 2>&1 | tee test-artifacts/portals-native.log
          python tests/browser_map_import.py 2>&1 | tee test-artifacts/semantic-native.log
          python scripts/audit_reference_maps.py ../graph/imgs
          python scripts/build_semantic_gif.py
          git diff --check
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-map-verification
          retention-days: 7
          path: |
            dispatch/test-artifacts/
            dispatch/docs/assets/dispatch-demo.gif
      - name: Commit only the reviewed integration and reference assets
        working-directory: dispatch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app.py README.md docs/guide.md docs/assets/dispatch-demo.gif data/reference_maps web/editor.html web/editor.js web/portal-editor.js web/locales.json tests/browser_editor.py tests/browser_portals.py tests/test_map_import.py
          git commit -m 'Integrate verified semantic map workflow and pinned source rasters'
          git push origin HEAD:refs/heads/feature/semantic-map-import
          git archive --format=zip --output=verified-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-verified-source
          path: dispatch/verified-source.zip
          retention-days: 1
